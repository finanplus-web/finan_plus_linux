# SPDX-License-Identifier: GPL-3.0-or-later
#
# Compila e testa o Finan+ para Linux em cada envio (push/pull request) e gera o .deb.
# Publicação automática: quando chega na main uma versão do meson.build que ainda não tem
# Release (ex.: 1.1.7 → v1.1.7), o fluxo cria a tag e a Release com o .deb e as notas do
# CHANGELOG.md. Enviar a tag vX.Y.Z manualmente também funciona.
name: Compilar e publicar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # necessário só para criar a Release

jobs:
  build:
    runs-on: ubuntu-24.04   # GTK 4.14 + libadwaita 1.5: o mínimo exigido pelo app
    env:
      FINAN_PLUS_NO_KEYRING: '1'   # testes sem chaveiro do sistema
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev libsodium-dev libsecret-1-dev dpkg-dev curl

      - name: Versão e decisão de publicar
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n "s/^  version: '\(.*\)',/\1/p" meson.build)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          PUBLISH=false
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            if [ "v$V" != "$GITHUB_REF_NAME" ]; then
              echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $V do meson.build"; exit 1
            fi
            PUBLISH=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = main ]; then
            # versão nova na main (ainda sem Release) → publicar
            gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || PUBLISH=true
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Versão $V — publicar: $PUBLISH"

      - name: Compilar, testar e gerar o .deb
        run: packaging/build-deb.sh

      - name: Guardar o .deb (artefato da execução)
        uses: actions/upload-artifact@v4
        with:
          name: finan-plus-deb
          path: finan-plus_*_amd64.deb

      - name: Gerar o AppImage
        run: packaging/build-appimage.sh

      - name: Guardar o AppImage (artefato da execução)
        uses: actions/upload-artifact@v4
        with:
          name: finan-plus-appimage
          path: finan-plus_*_*.AppImage

      - name: Notas da versão
        if: steps.ver.outputs.publish == 'true'
        run: |
          V=${{ steps.ver.outputs.version }}
          # trecho do CHANGELOG.md entre "## <versão>" e o próximo "## "
          awk -v v="$V" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notas.md
          printf '\n---\n**Instalar (.deb):** baixe o `.deb` abaixo e rode `sudo apt install ./finan-plus_%s_amd64.deb`\n(Ubuntu 24.04+, Linux Mint 22, Debian 13, KDE neon, Pop!_OS 24.04).\n\n**AppImage (outras distribuições):** baixe o `.AppImage`, torne executável (`chmod +x finan-plus_%s_x86_64.AppImage`) e execute.\n' "$V" "$V" >> notas.md
          cat notas.md

      - name: Criar Release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          # se a Release já existe (ex.: criada pelo site do GitHub), só anexa os pacotes a ela;
          # senão cria a tag vX.Y.Z neste commit e a Release
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" finan-plus_*_amd64.deb finan-plus_*_*.AppImage --clobber
          else
            gh release create "v$V" finan-plus_*_amd64.deb finan-plus_*_*.AppImage --target "$GITHUB_SHA" \
              --title "Finan+ para Linux $V" --notes-file notas.md
          fi
